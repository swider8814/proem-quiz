name: Build i deploy

# Scalenie do main: testy + obraz w GHCR, BEZ wgrywania na serwer.
# Deploy na serwer tylko na żądanie: Actions → „Build i deploy” → Run workflow (gałąź main).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/swider8814/proem-quiz

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: npm ci
      - run: npm run check
      - run: npm run build
      # Wyjście testów trafia też do /tmp/ci.log – przy błędzie linie „✘” idą jako adnotacje w PR.
      # `shell: bash` = `bash -eo pipefail`: bez tego kod wyjścia `tee` (0) maskował nieudane testy.
      - run: npm test 2>&1 | tee -a /tmp/ci.log
        shell: bash
      - run: npm run test:e2e 2>&1 | tee -a /tmp/ci.log
        shell: bash
      - run: CHROME_PATH="$(which google-chrome)" npm run test:ui 2>&1 | tee -a /tmp/ci.log
        shell: bash
      - name: Nieudane testy (adnotacje)
        if: failure()
        run: grep -h '^✘' /tmp/ci.log 2>/dev/null | head -20 | sed -e 's/\x1b\[[0-9;]*m//g' -e 's/^/::error title=Test::/' || true

  # Na PR-ach: obraz budowany lokalnie i uruchamiany jak na Mikrusie (bez wysyłania do rejestru).
  image-smoke:
    needs: check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build obrazu
        run: docker build -t proem-quiz:test .
      - name: Start kontenera jak na Mikrusie (docker-compose.yml z ograniczeniami)
        run: |
          mkdir data && sudo chown 10471:10471 data && sudo chmod 700 data
          printf 'PORT=3000\nORIGIN=http://localhost:3000\nTOTP_ENCRYPTION_KEY=%s\nQUIZ_UID=10471\n' "$(openssl rand -base64 32)" > .env
          QUIZ_IMAGE=proem-quiz:test docker compose up -d
          for i in $(seq 1 30); do curl -fsS http://localhost:3000/health && break; sleep 2; done
          curl -fsS http://localhost:3000/health
          test "$(docker inspect -f '{{.HostConfig.ReadonlyRootfs}} {{.Config.User}} {{.HostConfig.Memory}} {{.HostConfig.NanoCpus}} {{.HostConfig.CpuShares}} {{.HostConfig.OomScoreAdj}}' proem-quiz)" = "true 10471:10471 469762048 600000000 256 500"
          docker inspect -f '{{.State.Health.Status}}' proem-quiz
      - name: Pierwszy administrator przez CLI i link aktywacyjny
        run: |
          out="$(docker compose exec -T app node server/cli.js create-admin test@example.com "Test Admin")"
          echo "$out"
          link="$(echo "$out" | grep -o 'http://localhost:3000/invite/[A-Za-z0-9_-]*')"
          test -n "$link"
          curl -fsS -H 'accept: text/html' "$link" | grep -q 'type="password"'
          sudo ls -ln data
      - name: ffmpeg i zapis działają przy systemie plików tylko do odczytu
        run: |
          docker compose exec -T app ffmpeg -nostdin -hide_banner -loglevel error -f lavfi -i sine=duration=1 -y /data/media/smoke.mp3
          docker compose exec -T app ffprobe -v error -show_entries format=duration -of csv=p=0 /data/media/smoke.mp3
          # Obrazki: miniatury WebP (libwebp) w obrazie produkcyjnym
          docker compose exec -T app ffmpeg -nostdin -hide_banner -loglevel error -f lavfi -i testsrc=size=640x480 -frames:v 1 -c:v libwebp -quality 75 -f webp -y /data/media/smoke.webp
          docker compose exec -T app ffprobe -v error -show_entries stream=codec_name -of csv=p=0 /data/media/smoke.webp | grep -q webp
          ! docker compose exec -T app sh -c 'touch /app/x' 2>/dev/null
          ! docker compose exec -T app sh -c 'touch /etc/x' 2>/dev/null
      - name: Próba lokalna (docker-compose.local.yml) też startuje
        run: |
          docker compose down
          printf 'ORIGIN=http://localhost:3000\nTOTP_ENCRYPTION_KEY=%s\n' "$(openssl rand -base64 32)" > .env.local
          docker tag proem-quiz:test proem-quiz:local
          docker compose -f docker-compose.local.yml --env-file .env.local up -d --no-build
          for i in $(seq 1 30); do curl -fsS http://localhost:3000/health && break; sleep 2; done
          curl -fsS http://localhost:3000/health
          docker compose -f docker-compose.local.yml --env-file .env.local exec -T app node server/cli.js create-admin local@example.com "Local" | grep -q '/invite/'
          docker compose -f docker-compose.local.yml --env-file .env.local down -v
      - name: deploy.sh i docker-compose.yml ze skryptu są spójne z repo
        run: node tests/deploy-files.test.mjs
      - name: Logi kontenera
        if: always()
        run: docker compose logs app 2>&1 | tail -50

  image:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Czas budowy (wersja w stopce panelu)
        id: built
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            APP_VERSION=${{ github.sha }}
            APP_BUILD=${{ github.run_number }}
            APP_BUILT_AT=${{ steps.built.outputs.at }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    # Tylko ręcznie uruchomiony workflow na main – scalenie PR-a niczego nie wgrywa na serwer.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      # Klucz na serwerze jest ograniczony (command=…/deploy.sh,restrict): nie daje powłoki ani
      # możliwości kopiowania plików – może wyłącznie uruchomić aktualizację quizu.
      - name: Aktualizacja na Mikrusie
        env:
          HOST: ${{ secrets.MIKRUS_HOST }}
          PORT: ${{ secrets.MIKRUS_SSH_PORT }}
          USER_NAME: ${{ secrets.MIKRUS_USER }}
          KEY: ${{ secrets.MIKRUS_SSH_KEY }}
          FP: ${{ secrets.MIKRUS_SSH_FINGERPRINT }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          # Każdy nieoczekiwany błąd pokazuje linię i kod (bez wartości sekretów).
          trap 'rc=$?; echo "::error::Deploy przerwany w linii $LINENO (kod $rc)"' ERR
          if [ -z "$FP" ]; then echo "::error::Brak sekretu MIKRUS_SSH_FINGERPRINT – deploy przerwany (patrz README)"; exit 1; fi
          umask 077
          mkdir -p ~/.ssh
          # Format sekretów (wartości nie trafiają do logu).
          [[ "$HOST" =~ ^[A-Za-z0-9.-]+$ ]] || { echo "::error::MIKRUS_HOST: pusty albo ze spacją (np. srv19.mikr.us)"; exit 1; }
          [[ "$PORT" =~ ^[0-9]{1,5}$ ]] || { echo "::error::MIKRUS_SSH_PORT: oczekiwana sama liczba (np. 10148)"; exit 1; }
          [[ "$USER_NAME" =~ ^[a-z_][a-z0-9_-]*$ ]] || { echo "::error::MIKRUS_USER: pusty albo ze spacją (oczekiwane: root)"; exit 1; }
          printf '%s\n' "$KEY" | tr -d '\r' > ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null 2>&1 || { echo "::error::MIKRUS_SSH_KEY: nie da się odczytać klucza (niepełny blok BEGIN…END?)"; exit 1; }
          # Zaufany jest tylko klucz serwera o odcisku z sekretu (ochrona przed podstawionym serwerem).
          # Kod ≠ 0 bywa, gdy serwer nie ma części typów kluczy – liczy się zawartość pliku, sprawdzana niżej.
          ssh-keyscan -T 15 -p "$PORT" "$HOST" 2>/dev/null > /tmp/scanned || true
          : > ~/.ssh/known_hosts
          while read -r line; do
            [ -z "$line" ] && continue
            case "$line" in \#*) continue ;; esac
            fp=$(printf '%s\n' "$line" | ssh-keygen -lf - 2>/dev/null | awk '{print $2}' || true)
            if [ "$fp" = "$FP" ]; then printf '%s\n' "$line" >> ~/.ssh/known_hosts; fi
          done < /tmp/scanned
          if [ ! -s ~/.ssh/known_hosts ]; then echo "::error::Odcisk klucza serwera nie zgadza się z MIKRUS_SSH_FINGERPRINT"; exit 1; fi
          printf '%s %s\n' "$GH_ACTOR" "$GHCR_TOKEN" | ssh -i ~/.ssh/deploy_key -p "$PORT" \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts \
            -o IdentitiesOnly=yes -o ConnectTimeout=20 -o BatchMode=yes -o LogLevel=VERBOSE \
            "$USER_NAME@$HOST" deploy
          rm -f ~/.ssh/deploy_key
