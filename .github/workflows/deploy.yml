name: Build i deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Wdrożenie na Mikrusa
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.MIKRUS_HOST }}       # np. srv12.mikr.us
          port: ${{ secrets.MIKRUS_SSH_PORT }}   # port SSH z panelu Mikrusa
          username: ${{ secrets.MIKRUS_USER }}   # zwykle root
          key: ${{ secrets.MIKRUS_SSH_KEY }}     # prywatny klucz deploy (ed25519)
          command_timeout: 10m
          script: bash ~/proem-quiz/scripts/deploy.sh
