name: Build i deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/swider8814/proem-quiz

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm test
      - run: npm run test:e2e
      - run: CHROME_PATH="$(which google-chrome)" npm run test:ui

  image:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: APP_VERSION=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - name: Wymagany fingerprint serwera
        env:
          FP: ${{ secrets.MIKRUS_SSH_FINGERPRINT }}
        run: |
          if [ -z "$FP" ]; then echo "::error::Brak sekretu MIKRUS_SSH_FINGERPRINT – deploy przerwany (patrz README)"; exit 1; fi
      - uses: actions/checkout@v4
      - name: Kopiuj docker-compose.yml na Mikrusa
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.MIKRUS_HOST }}
          port: ${{ secrets.MIKRUS_SSH_PORT }}
          username: ${{ secrets.MIKRUS_USER }}
          key: ${{ secrets.MIKRUS_SSH_KEY }}
          fingerprint: ${{ secrets.MIKRUS_SSH_FINGERPRINT }}
          source: docker-compose.yml
          target: proem-quiz
      - name: Pobierz nowy obraz i uruchom
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.MIKRUS_HOST }}
          port: ${{ secrets.MIKRUS_SSH_PORT }}
          username: ${{ secrets.MIKRUS_USER }}
          key: ${{ secrets.MIKRUS_SSH_KEY }}
          fingerprint: ${{ secrets.MIKRUS_SSH_FINGERPRINT }}
          command_timeout: 10m
          script: |
            set -e
            cd ~/proem-quiz
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
            docker logout ghcr.io
            sleep 5
            docker compose ps
